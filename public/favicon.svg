<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
  </defs>
  
  <!-- Trophy cup -->
  <path d="M18 12 L18 24 C18 36 24 44 32 44 C40 44 46 36 46 24 L46 12 Z" fill="url(#gold)" stroke="#E6A800" stroke-width="1.5"/>
  
  <!-- Cup rim -->
  <ellipse cx="32" cy="12" rx="15" ry="4" fill="#FFD700" stroke="#E6A800" stroke-width="1.5"/>
  
  <!-- Stem -->
  <rect x="29" y="44" width="6" height="10" rx="1" fill="#E6A800"/>
  
  <!-- Base -->
  <rect x="22" y="54" width="20" height="4" rx="2" fill="#E6A800"/>
  
  <!-- Left handle -->
  <path d="M18 16 C8 14 8 28 20 26" stroke="url(#handle)" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Right handle -->
  <path d="M46 16 C56 14 56 28 44 26" stroke="url(#handle)" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Star on trophy -->
  <path d="M32 18 L34 24 L40 24 L35 28 L37 34 L32 30 L27 34 L29 28 L24 24 L30 24 Z" fill="#FFF8E1" opacity="0.9"/>
  
  <!-- Sparkles -->
  <circle cx="10" cy="10" r="1.5" fill="#FFD700" opacity="0.8"/>
  <circle cx="54" cy="8" r="1" fill="#FFC107" opacity="0.7"/>
  <circle cx="56" cy="20" r="1.5" fill="#FFD700" opacity="0.6"/>
</svg>

services:
    nginx:
        image: nginx:1.29.8-alpine
        volumes:
            - ./:/app
            - ./docker/dev/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
        ports:
            - 8081:80
        depends_on:
            - php-fpm

    php-fpm:
        build:
            dockerfile: ./docker/common/php-fpm/Dockerfile
            target: dev
        environment:
            APP_URL: ${APP_URL:-http://localhost:8081}
        volumes:
            - ./:/app
        depends_on:
            - postgres

    php-cli:
        build:
            dockerfile: ./docker/common/php-cli/Dockerfile
            target: dev
        environment:
            APP_URL: ${APP_URL:-http://localhost:8081}
        volumes:
            - ./:/app
        depends_on:
            - postgres

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - 5433:5432
        volumes:
            - postgres_data_app_staff:/var/lib/postgresql/data

volumes:
    postgres_data_app_staff:

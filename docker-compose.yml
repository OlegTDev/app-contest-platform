services:
    nginx:
        image: nginx:${NGINX_VERSION}-alpine
        volumes:
            - ./:/app
            - ./docker/dev/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
        ports:
            - ${NGINX_PORT}:80
        depends_on:
            - php-fpm

    php-fpm:
        build:
            dockerfile: ./docker/common/php-fpm/Dockerfile
            target: dev
            args:
                - PHP_FPM_VERSION=${PHP_FPM_VERSION}
        volumes:
            - ./:/app
        depends_on:
            - postgres

    php-cli:
        build:
            dockerfile: ./docker/common/php-cli/Dockerfile
            target: dev
            args:
                - PHP_CLI_VERSION=${PHP_CLI_VERSION}
        volumes:
            - ./:/app
        depends_on:
            postgres:
                condition: service_started

    postgres:
        image: postgres:${POSTGRES_VERSION}-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - ${POSTGRES_PORT}:5432
        volumes:
            - postgres_data_app_staff:/var/lib/postgresql

volumes:
    postgres_data_app_staff:
